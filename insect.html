<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insect Game</title>
</head>
<body>

    <div class="screen">
        <h1>Catch the Insect</h1>
        <button class="btn" id="start-btn">Play Game</button>
    </div>
    <div class="screen">
        <h1>What is your favorite insect?</h1>
        <ul>
            <li>
            <button class="choose-insect-btn">
                <p>Fly</p>
                <img src="images/fly.png" alt="Fly">
            </button>
            </li>
            <li>
            <button class="choose-insect-btn">
                <p>Mosquito</p>
                <img src="images/mosquito.jpg" alt="Mosquito">
            </button>
            </li>
            <li>
            <button class="choose-insect-btn">
                <p>Spider</p>
                <img src="images/spider.png" alt="Spider">
            </button>
            </li>
            <li>
            <button class="choose-insect-btn">
                <p>Roach</p>
                <img src="images/roach.png" alt="Roach">
            </button>
            </li>
        </ul>
    </div>


    <script src="script/insect.js"></script>
</body>
</html>
